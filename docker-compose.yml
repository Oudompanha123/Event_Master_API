services:
  event-master-meta:
    image: event-master-meta:1.0.0-meta
    container_name: event-master-meta
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '8899:8080'
    # Credentials are read from .env (copy .env.example to .env first).
    env_file:
      - .env
    volumes:
      # Uploaded images are written relative to the container working dir (/),
      # so this keeps them on the host across rebuilds.
      - ./data:/src/main/resources
