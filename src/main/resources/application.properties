spring.application.name=${APP_NAME:final_project}

# Every value below is env-driven: ${VAR:default}. Defaults match the previous
# hardcoded settings, so an unset environment behaves exactly as before.
# Real values live in .env (git-ignored); see .env.example for the template.

## DATASOURCE
# Passwords have no default on purpose - they must come from the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

## MAIL
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:eventmaster168@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=${MAIL_ENCODING:UTF-8}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.mime.charset=${MAIL_MIME_CHARSET:UTF}

##MULTIPART (MultipartProperties)
#Enable multipart uploads
spring.servlet.multipart.enabled=${MULTIPART_ENABLED:true}
#Threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=${MULTIPART_FILE_SIZE_THRESHOLD:2KB}
#Max file size.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:20MB}
#Max Request size
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:50MB}

#time zone
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Phnom_Penh}
server.port=${SERVER_PORT:8080}
