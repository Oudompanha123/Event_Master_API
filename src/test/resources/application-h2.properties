# Profile for the Docker-free context check. H2 only has to accept a connection
# here - no project SQL is executed against it, see ContextLoadsWithoutDockerTest.
DB_PASSWORD=sa
MAIL_PASSWORD=test

spring.datasource.url=jdbc:h2:mem:event-master;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
