# Profile used by PostgresTestBase. The datasource URL/user/password are
# injected at runtime by Testcontainers; everything here just fills in the
# placeholders from the main application.properties that have no default.
DB_PASSWORD=overridden-by-testcontainers
MAIL_PASSWORD=test
# Signing key is irrelevant to these tests; any valid Base64 will do.
JWT_SECRET=dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5vdC11c2VkLWluLXByb2R1Y3Rpb24tMDE=

# Create the schema in the throwaway container before the tests run.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:script/scheme.sql,classpath:db/test-schema-extra.sql
